[build-system]
requires = ["setuptools>=77", "wheel", "Cython>=3.1,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-selection"
version = "1.5.0"
description = "Validation-constrained recursive feature and feature-group selection with paired bootstrap evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "joblib>=1.2,<2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/tranvanphuongdevdream-web/recursive-selection"
Repository = "https://github.com/tranvanphuongdevdream-web/recursive-selection"
Documentation = "https://github.com/tranvanphuongdevdream-web/recursive-selection#readme"
Issues = "https://github.com/tranvanphuongdevdream-web/recursive-selection/issues"
Changelog = "https://github.com/tranvanphuongdevdream-web/recursive-selection/blob/master/CHANGELOG.md"

[project.optional-dependencies]
catboost = ["catboost>=1.2.8,<2"]
xgboost = ["xgboost>=2.1,<4"]
lightgbm = ["lightgbm>=4.3,<5"]
gbc = ["shap>=0.46,<1"]
all = ["catboost>=1.2.8,<2", "xgboost>=2.1,<4", "lightgbm>=4.3,<5", "shap>=0.46,<1"]
plot = ["matplotlib>=3.8,<4"]
report = ["pandas>=2.2,<4", "jinja2>=3.1.2,<4"]
notebook = ["pandas>=2.2,<4", "jinja2>=3.1.2,<4", "matplotlib>=3.8,<4", "ipython>=8,<10"]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "Cython>=3.1,<4", "setuptools>=77", "wheel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: exercises an installed optional model backend"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_* *-manylinux_aarch64 *-manylinux_ppc64le *-manylinux_s390x *-manylinux_armv7l"
test-extras = ["all", "plot", "report", "test"]
test-command = "python -m pytest {project}/tests --require-compiled --require-all-backends"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
before-test = "brew list libomp >/dev/null 2>&1 || brew install libomp"

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = true
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/recursive_selection/__init__.py:__version__"]
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.release_pipeline]
# One-time migration: source 0.5.0 follows the existing v0.4.0 tag.
bootstrap_version = "0.5.0"
